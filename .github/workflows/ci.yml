name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # POSTGRES_HOST_AUTH_METHOD: trust (sin password) es un riesgo aceptado y documentado
      # en docs/daw/security/threat-FEAT-003.md (riesgo F-TM-04). Es un contenedor de servicio
      # efímero, solo alcanzable desde los steps de este job (no expuesto a la red pública ni
      # a otros jobs) y se destruye al terminar la corrida. Reproduce exactamente el default de
      # TEST_DATABASE_URL en backend/tests/conftest.py (usuario testuser, sin password), para
      # que la suite de tests corra sin configuración adicional.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_DB: reserva_vehiculos_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
